<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LegalAid Pro - Sign In</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="assets/css/signin.css">
</head>
<body>
  <!-- Navbar -->
<header>
    <div class="logo">
        <i class="fa-solid fa-scale-balanced"></i>
        <span>LegalAid Pro</span>
    </div>
<nav>
        <a href="home.html">Home</a>
        <a href="Submit Case.html">Submit Case</a>
        <a href="find-lawyers.html">Find Lawyers</a>
        <a href="Track-Case.html">Track Case</a>
        <a href="Dashboard.html">Dashboard</a>
        <a href="About_us.html" class="active">About Us</a>
        <a href="Contact.html">Contact</a>
        <button class="signin-btn">Sign In</button>
</nav>
</header>

  <!-- Sign In Box -->
  <main>
    <div class="signin-box">
      <h2>Sign In to LegalAid Pro</h2>
      <p>Access Your Legal dashboard</p>

      <form>
        <label>Email/ Username</label>
        <input type="text" placeholder="Enter your email or username">

        <label>Password</label>
        <input type="password" placeholder="Enter your password">

        <div class="options">
          <label><input type="checkbox"> Remember Me</label>
          <a href="#">Forgot Password?</a>
        </div>

        <button type="submit">Sign In</button>

        <p class="create">Don`t have an account? <a>Create an Account</a></p>
      </form>
    </div>
  </main>
</body>
</html>
