<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LegalAid Pro - Track Your Case</title>
<link rel="stylesheet" href="assets/css/Track-Case.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

  <!-- Header Section -->
<header>
    <div class="logo">
        <i class="fa-solid fa-scale-balanced"></i>
        <span>LegalAid Pro</span>
    </div>
    <a href="home.html" class="back-home">← Back to home</a>
</header>

  <!-- Main Section -->
  <main>
    <h1>Track Your Case</h1>
    <p class="subtitle">Enter your case number and court name to get real-time updates on your legal proceedings</p>

    <!-- Case Lookup Box -->
    <section class="case-lookup">
      <h2>Case Lookup</h2>
      <p>Enter your case details to track the current status and recent updates</p>

      <!-- 
        The <form> tag is not needed for this, but we can leave it.
        The JavaScript will handle the button click.
      -->
      <form>
        <div class="input-group">
          <label for="caseNumber">Case Number*</label>
          <!-- This ID "caseNumber" is used in our JavaScript -->
          <input type="text" id="caseNumber" placeholder="e.g. CASE123">
        </div>

        <div class="input-group">
          <label for="courtName">Court Name*</label>
          <!-- This field is not used by our JSON, but we leave it -->
          <input type="text" id="courtName" placeholder="e.g. Superior Court">
        </div>

        <!-- 
          CHANGE 1:
          - Changed type="submit" to type="button". This stops the page
            from refreshing when you click it.
          - Added id="track-button" so our JavaScript can find it.
        -->
        <button type="button" id="track-button" class="track-btn">🔍 Track Case</button>
      </form>

      <!-- 
        CHANGE 2:
        - Added this empty div. This is where our JavaScript
          will put the case status results.
      -->
      <div id="result-div">
          <!-- Results will appear here -->
      </div>
    </section>
    
  </main>

  <!-- 
    CHANGE 3:
    - Added the <script> tag here to link our new JavaScript file.
  -->
  <script src="assets/js/track-case.js"></script>

</body>
</html>
